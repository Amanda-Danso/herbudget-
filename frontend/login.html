<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — HerBudget</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">💜 HerBudget</div>
      <p class="auth-subtitle">Welcome back! Log in to your account.</p>

      <form id="login-form" novalidate>
        <div class="field" id="field-email">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
          <div class="field-error">Please enter a valid email address.</div>
        </div>

        <div class="field" id="field-password">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
          <div class="field-error">Please enter your password.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          Login
        </button>
      </form>

      <p class="auth-footer text-muted">
        Don't have an account? <a href="register.html">Create an account</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
