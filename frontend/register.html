<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create an account — HerBudget</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">💜 HerBudget</div>
      <p class="auth-subtitle">Create your account to start budgeting.</p>

      <form id="register-form" novalidate>
        <div class="field" id="field-name">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required />
          <div class="field-error">Please enter your name.</div>
        </div>

        <div class="field" id="field-email">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
          <div class="field-error">Please enter a valid email address.</div>
        </div>

        <div class="field" id="field-password">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required />
          <div class="field-error">Password must be at least 8 characters.</div>
          <div class="field-hint">Use at least 8 characters.</div>
        </div>

        <div class="field" id="field-confirm-password">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required />
          <div class="field-error">Passwords do not match.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          Create Account
        </button>
      </form>

      <p class="auth-footer text-muted">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
